services:
  auto-southwest:
    image: dmytrokoren/auto-southwest-check-in:develop
    command: ["--verbose"]
    container_name: auto-southwest
    restart: unless-stopped
    init: true
    shm_size: "2gb"
    environment:
      TZ: "${TZ:-America/Chicago}"
    volumes:
      - ./config.json:/app/config.json:ro
